name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      real_cli_smoke:
        description: 'Run explicitly opted-in real CLI smoke tests'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check fixture sensitivity
        run: pnpm fixtures:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  manual-smoke:
    name: Opt-in real CLI smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_cli_smoke == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run manual smoke suite
        env:
          AGENTSCOPE_REAL_CLI_SMOKE: '1'
        run: pnpm test:manual-smoke
